server:
  port: 8080
  servlet:
    context-path: /

spring:
  task:
    scheduling:
      pool:
        size: 4
  application:
    name: equifolio-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:equifolio}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: EquiFolioHikariCP
      maximum-pool-size: 15
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate # DDL được quản lý chặt chẽ 100% qua Flyway Migration
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Cấu hình CORS cho kết nối Frontend
app:
  cors:
    allowed-origins:
      - "http://localhost:5173"
      - "http://localhost:3000"
      - "http://127.0.0.1:5173"

# Cấu hình Google Gemini AI Copilot (Google Cloud Vertex AI qua Service Account)
gemini:
  service-account-key-path: ${GEMINI_SA_KEY_PATH:}
  project-id: ${GEMINI_PROJECT_ID:gen-lang-client-0656432358}
  location: ${GEMINI_LOCATION:us-central1}
  model: ${GEMINI_MODEL:gemini-2.5-flash-lite}
  api-key: ${GEMINI_API_KEY:}

# Cấu hình JWT Token
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: 86400000 # 24 giờ (ms)

# Cấu hình API Vàng & Thị trường ngoài
market-data:
  vnappmob:
    api-key: ${VNAPPMOB_API_KEY:eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJleHAiOjE3OTM0NTk4MDYsImlhdCI6MTc5MjE2MzgwNiwic2NvcGUiOiJnb2xkIiwicGVybWlzc2lvbiI6MH0.SHtF39PfT9Blqe4KTOG2RHMdhAAGKMuBlY36b3nOvDA}
    gold-url: "https://vapi.vnappmob.com/api/v2/gold/sjc"



# OpenAI-compatible embeddings endpoint. Empty URL means explicit full-text mode.
knowledge:
  embedding-url: ${EMBEDDING_URL:}
  embedding-model: ${EMBEDDING_MODEL:}
  embedding-key: ${EMBEDDING_API_KEY:}

# Experimental: current OOS TAA underperforms SAA. Explicit opt-in only.
ml:
  taa-enabled: ${ML_TAA_ENABLED:false}
  stock-model: ${ML_STOCK_MODEL:native}
  native-url: ${REGIME_NATIVE_URL:http://127.0.0.1:8091}
  native-token: ${REGIME_API_TOKEN:}
  native-managed: ${REGIME_MANAGED:true}
  native-python: ${REGIME_PYTHON:python3}
  native-script: ${REGIME_WORKER_SCRIPT:../ml/serve_regime_shock.py}

# Annual percentage used by the application for early savings withdrawals.
savings:
  early-withdrawal-rate: ${SAVINGS_EARLY_WITHDRAWAL_RATE:0.1}
